# Deployment-ready workflow for a repository whose ROOT is the complete package.
# Parent copies this to .github/workflows/ after publishing the reviewed snapshot.
name: Frozen Strong Mason comparator and nanoda

on:
  push:
  workflow_dispatch:
    inputs:
      submission_directory:
        description: Repository-relative directory containing Submission.lean
        required: true
        type: string
        default: '.'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free runner disk space as in frozen benchmark CI
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out the exact source snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install elan using a trusted empty package
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          lake-package-directory: verification/linux-bootstrap
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Select the frozen Go compiler
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false

      - name: Select the official submission Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11.10'

      - name: Replay the frozen comparator and independent kernel
        env:
          VERIFICATION_SUBMISSION_DIRECTORY: ${{ inputs.submission_directory || '.' }}
        run: |
          bash scripts/verify_linux.sh \
            --submission-dir "$GITHUB_WORKSPACE/$VERIFICATION_SUBMISSION_DIRECTORY" \
            --run-root "$RUNNER_TEMP/strong-mason-linux-replay"

      - name: Retain verifier evidence, including failed stages
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frozen-strong-mason-${{ github.sha }}
          path: |
            ${{ runner.temp }}/strong-mason-linux-replay/logs
            ${{ runner.temp }}/strong-mason-linux-replay/metadata
          if-no-files-found: warn
          retention-days: 14
